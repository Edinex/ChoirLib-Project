<!DOCTYPE html>
<html lang="en">
<head>


  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ChoirLib — Welcome</title>


  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">


  <!-- Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">


  <!-- Styles -->
  <link rel="stylesheet" href="../styles/main.css">
  <link rel="stylesheet" href="../styles/welcome.css">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>


  <!-- Hero Section -->
  <div class="hero">
    <div class="hero-overlay"></div>
    <div class="hero-content">
      <i class="fa-solid fa-music hero-icon"></i>
      <h2 class="hero-title">
        Your Music.<br>
        <span class="gold">Anywhere.</span>
      </h2>
    </div>
  </div>


  <!-- Body Section -->
  <div class="welcome-body">


    <h2 class="welcome-heading">
      The choir library that never runs out of copies
    </h2>


    <p class="welcome-sub">
      Access sheet music, audio, video tutorials
      and connect with choirs worldwide —
      all in one place.
    </p>


    <!-- Features -->
    <div class="features-row">
      <div class="feature-item">
        <i class="fa-solid fa-file-pdf"></i>
        <span>Sheet Music</span>
      </div>
      <div class="feature-item">
        <i class="fa-solid fa-music"></i>
        <span>Audio</span>
      </div>
      <div class="feature-item">
        <i class="fa-solid fa-people-group"></i>
        <span>Community</span>
      </div>
      <div class="feature-item">
        <i class="fa-solid fa-wand-magic-sparkles"></i>
        <span>AI Tools</span>
      </div>
    </div>


    <!-- Buttons -->
    <button class="btn-gold" id="btn-register">
      Create an Account
      <i class="fa-solid fa-arrow-right"></i>
    </button>


    <button class="btn-primary" id="btn-login">
      Sign In
    </button>


    <button class="btn-outline" id="btn-guest">
      Continue as Guest
    </button>


    <p class="footer-note">
      By continuing you agree to our
      <span class="gold">Terms & Privacy Policy</span>
    </p>


  </div>


  <!-- Scripts -->
   <script src="../js/supabase.js"></script>
  <script src="../js/navigation.js"></script>
  <script src="../js/welcome.js"></script>


</body>
</html>
